[package]
name = "ostrya-mountd"
description = "Mount daemon of ostrya: mounts composefs trees for callers in their own user namespace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ostrya-mountd"
path = "src/main.rs"

[features]
default = ["smol", "lzma-static"]
smol = ["ostrya/smol", "ostrya-rt/smol"]
tokio = ["ostrya/tokio", "ostrya-rt/tokio"]
# The shipped binary links xz statically, so it needs no runtime liblzma.
lzma-static = ["ostrya/lzma-static"]

[dependencies]
# The repository code: the open of the repository of a request, its mode and
# its config, the image of an image commit, and the build of an image. The
# daemon also names it for its `smol`, `tokio`, and `lzma-static` features.
ostrya = { workspace = true }
# The protocol of the daemon and the mount steps.
ostrya-mount = { workspace = true }
ostrya-rt = { workspace = true }
# The socket that systemd passes, the namespace checks, the groups of the
# peer, and the sealed memory file of a built image.
ostrya-sys = { workspace = true }
clap = { version = "4", features = ["derive"] }
# The listening socket, `poll` on it, and the pidfd of the parent. `mount`
# gives `open_tree` and the mount attribute flags. `thread` gives `setns` and
# the switch of the ids in the worker. Each of these calls is safe in rustix.
rustix = { version = "1", default-features = false, features = [
    "std",
    "fs",
    "mount",
    "net",
    "event",
    "process",
    "thread",
] }
