[workspace]
resolver = "3"
members = [
    "crates/ostrya-gvariant",
    "crates/ostrya-core",
    "crates/ostrya-composefs",
    "crates/ostrya-rt",
    "crates/ostrya-sign",
    "crates/ostrya-fetch",
    "crates/ostrya-remote",
    "crates/ostrya-sys",
    "crates/ostrya",
    "crates/ostrya-mount",
    "crates/ostrya-mountd",
    "crates/ostrya-server",
    "crates/ostrya-cli",
    "crates/ostrya-conformance",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/growler/ostrya"
readme = "README.md"

[workspace.dependencies]
ostrya-gvariant = { path = "crates/ostrya-gvariant", version = "0.5.0" }
ostrya-core = { path = "crates/ostrya-core", version = "0.5.0" }
ostrya-composefs = { path = "crates/ostrya-composefs", version = "0.5.0" }
ostrya-rt = { path = "crates/ostrya-rt", version = "0.5.0", default-features = false }
ostrya-sign = { path = "crates/ostrya-sign", version = "0.5.0", default-features = false }
ostrya-fetch = { path = "crates/ostrya-fetch", version = "0.5.0", default-features = false }
ostrya-remote = { path = "crates/ostrya-remote", version = "0.5.0", default-features = false }
ostrya-sys = { path = "crates/ostrya-sys", version = "0.5.0" }
ostrya = { path = "crates/ostrya", version = "0.5.0", default-features = false }
ostrya-mount = { path = "crates/ostrya-mount", version = "0.5.0", default-features = false }
ostrya-server = { path = "crates/ostrya-server", version = "0.5.0", default-features = false }

# The RSA code of the spki engine computes with `num-bigint-dig`. The unit
# test that signs and verifies with keys of 2048, 8192, and 16384 bits takes
# about 10 seconds in a test build with no optimization of these two crates,
# and less than 1 second with it.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
