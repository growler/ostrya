[package]
name = "ostrya-cli"
description = "Command-line front-end for the ostrya library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ostrya"
path = "src/main.rs"

[features]
default = ["smol", "spki", "gpg"]
smol = ["ostrya/smol", "ostrya-rt/smol"]
tokio = ["ostrya/tokio", "ostrya-rt/tokio"]
spki = ["ostrya/sign-spki"]
gpg = ["ostrya/sign-gpg"]

[dependencies]
ostrya = { path = "../ostrya", default-features = false }
ostrya-rt = { workspace = true }
clap = { version = "4", features = ["derive"] }
# `commit --tar-pathname-filter` compiles an expression. The tool compiles it as
# a PCRE2 pattern through GLib's `GRegex`, so the port compiles it with PCRE2
# too (`docs/conformance/cli-surface.md`, "P2"). This is the one crate in the
# workspace that may name `pcre2`: the C library it vendors is built statically
# and this crate sets `publish = false`, so no published crate carries it. CI
# holds the rule (`.github/workflows/ci.yml`, "PCRE2 stays in ostrya-cli").
pcre2 = "0.2.11"

# `tests/conformance.rs` runs the conformance matrix against the binary this
# crate builds (`docs/conformance/harness.md`, "Cargo and CI wiring"). The
# harness links no library of the port; it drives the built binary.
[dev-dependencies]
ostrya-conformance = { path = "../ostrya-conformance" }
