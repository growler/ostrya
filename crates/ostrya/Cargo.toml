[package]
name = "ostrya"
description = "Pure-Rust async reimplementation of the ostree repository library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["smol"]
smol = [
    "ostrya-rt/smol",
    "ostrya-sign/smol",
    "ostrya-fetch/smol",
    "ostrya-remote/smol",
]
tokio = [
    "ostrya-rt/tokio",
    "ostrya-sign/tokio",
    "ostrya-fetch/tokio",
    "ostrya-remote/tokio",
]
# One feature for each key type of the spki engine.
sign-spki-p256 = ["ostrya-sign/sign-spki-p256"]
sign-spki-p384 = ["ostrya-sign/sign-spki-p384"]
sign-spki-ed25519 = ["ostrya-sign/sign-spki-ed25519"]
sign-spki-rsa = ["ostrya-sign/sign-spki-rsa"]
# The spki engine with each of its key types.
sign-spki = [
    "sign-spki-p256",
    "sign-spki-p384",
    "sign-spki-ed25519",
    "sign-spki-rsa",
    "ostrya-sign/sign-spki",
]
verify-gpg = ["ostrya-sign/gpg"]
sign-gpg = ["verify-gpg", "ostrya-sign/sign-gpg"]
# The trait `X509Signer`, and with the spki key features, the X.509 signer
# and the X.509 verifier of the spki engine.
sign-x509 = ["ostrya-sign/sign-x509"]
# The server side of a push: the receive policy, the checks it makes, and the
# session over the push wire protocol of ostrya-remote.
receive = []
# The client side of a push from a repository: the remote resolution, the
# refspecs, and the object source over a repository, on the push wire protocol
# of ostrya-remote.
push = []
# The pull from a bucket repository at an `s3://` address, with requests that
# the SigV4 signer of ostrya-remote signs, and the `bucket` module: the init,
# the writer lock, the object listing, the fsck, the prune, and the summary
# update of a bucket repository.
# With `push`, the push to a bucket repository.
s3 = ["ostrya-remote/s3"]
# Builds xz from source and links it statically, so the build needs no
# runtime liblzma. The feature is off by default, and a build without it
# takes the system liblzma.
lzma-static = ["liblzma/static"]

# The crate documentation links items of the signing and verification
# engines, of the receive policy, of the push client, and of the S3 support,
# and a feature gates each item. docs.rs adds these seven features to the
# default set, and the links then resolve. `sign-x509` adds the X.509 items
# of the signing engines to the pages.
# The `tokio` and `lzma-static` features change no documented item, so the
# list omits them.
[package.metadata.docs.rs]
features = ["sign-spki", "verify-gpg", "sign-gpg", "sign-x509", "receive", "push", "s3"]
rustdoc-args = ["--cfg", "docsrs"]

# The gates of the spki engine take the form `any(feature = ...)` over the key
# features of the engine, so that each key feature adds one item to each gate.
# A gate that names one feature is in this form too.
[lints.clippy]
non_minimal_cfg = "allow"

[dependencies]
ostrya-core = { workspace = true }
ostrya-composefs = { workspace = true }
ostrya-rt = { workspace = true }
ostrya-sign = { workspace = true }
ostrya-fetch = { workspace = true }
# The wire protocol of the push and of the pull over ssh. It is in every
# build: the receive side, the push client, and the serving side of the pull
# share its codec and its error type.
ostrya-remote = { workspace = true }
ostrya-sys = { workspace = true }
thiserror = "2"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
async-compression = { version = "0.4", default-features = false, features = [
    "deflate",
    "xz",
    "futures-io",
] }
# liblzma backs async-compression's xz codec (delta parts, both directions).
# The library reaches the codec through async-compression and names no
# liblzma item of its own. This direct dependency carries the `lzma-static`
# feature: Cargo unifies features per crate, so the feature turns on
# `liblzma/static` across the whole graph, and xz is then built from source
# with no runtime liblzma and no C runtime beyond the libc std already links.
# A build without the feature links the system liblzma 5.8 or later where
# `pkg-config` finds one, and builds the bundled source where it does not.
# `ostrya-cli` carries `lzma-static` in its default set.
liblzma = { version = "0.4" }
# bsdiff patch generation for static-delta `B` ops. Zero dependencies, no
# unsafe, and its output is the interleaved control/diff/extra layout
# `bspatch.rs` reads.
bsdiff = "0.2.1"
pin-project-lite = "0.2"
futures-io = "0.3"
futures-lite = "2"
smol-tar = { version = "0.1.7", default-features = false, features = ["smol"] }

[dev-dependencies]
ostrya-rt = { workspace = true }
futures-lite = "2"
smol-tar = { version = "0.1.7", default-features = false, features = ["smol"] }
# The fetcher tests and the HTTP pull tests serve requests from an in-process
# HTTP/1.1 and HTTP/2 server, over cleartext and over TLS, and one fetcher
# test sends a request through a hyper client. The fetcher and its TLS stack
# are in ostrya-fetch, so the test build names these crates itself.
hyper = { version = "1.11", default-features = false, features = [
    "client",
    "http1",
    "http2",
    "server",
] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }
rustls-graviola = "0.4"
futures-rustls = { version = "0.26", default-features = false }
rustls-pemfile = "2"
# The root-dependent tests call `process::geteuid`. The smol backend reaches
# rustix's `process` feature through its own dependencies and the tokio
# backend does not, so the test build asks for it here. The fetcher tests that
# need a refused port ask for `net`: they hold a TCP socket that is bound and
# does not listen, which std cannot make.
rustix = { version = "1", default-features = false, features = [
    "std",
    "process",
    "net",
] }
