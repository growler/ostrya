name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.92
        run: |
          rustup toolchain install 1.92 --profile minimal -c rustfmt -c clippy
          rustup default 1.92

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # PCRE2 is the second C library in the tree, and it belongs to the
      # unpublished binary alone: `ostrya-cli` compiles the `commit
      # --tar-pathname-filter` expression with it and sets `publish = false`, so
      # no published crate links it (`CLAUDE.md`, goal 1). The rule covers the
      # whole `pcre2` name family, because `pcre2-sys` reaches the same C
      # library on its own. This fails when any other manifest names a `pcre2`
      # crate.
      - name: PCRE2 stays in ostrya-cli
        run: |
          cargo metadata --format-version 1 --all-features \
            | jq -e '[.packages[]
                      | select(.name | test("^pcre2") | not)
                      | select(any(.dependencies[]?.name; test("^pcre2")))
                      | .name] == ["ostrya-cli"]'

      # `.cargo/config.toml` pins `pcre2-sys` to its vendored static build. A
      # runner that carries `libpcre2-dev` links its own PCRE2 without the pin,
      # and the dialect `commit --tar-pathname-filter` compiles follows that
      # version. `pcre2-sys` also builds the vendored copy where `pkg-config`
      # finds no `libpcre2-8`. This step installs `libpcre2-dev`, so the system
      # library is present and the step holds the pin and not only the shipped
      # binary's linkage.
      - name: PCRE2 is linked statically
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev
          cargo build -p ostrya-cli
          ! readelf -d target/debug/ostrya | grep -qi pcre2

      # Every package in the graph, under every feature, must carry a
      # permissive license (`CLAUDE.md`, "Requirement: permissive licenses
      # only"), so the MIT library puts no copyleft obligation on a downstream
      # consumer. The expression normalizes the legacy slash forms `A/B` and
      # `A / B` to `A OR B` before it matches, because nine packages in the
      # graph state a permissive choice that way and an SPDX-strict match would
      # reject all nine. It reads an expression as a set of `AND` terms and
      # asks each term for one permissive option, so `MIT OR Apache-2.0 OR
      # LGPL-2.1-or-later` passes and `MIT AND GPL-3.0-only` fails. A null or an
      # empty license field fails as well, and such a package is inspected by
      # hand before it is accepted.
      - name: Every license is permissive
        run: |
          cargo metadata --format-version 1 --all-features \
            | jq -e -r '
                ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
                 "0BSD", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause",
                 "ISC", "Zlib", "Unlicense", "BSL-1.0", "Unicode-3.0"] as $ok
                | [ .packages[]
                    | { crate: "\(.name) \(.version)",
                        spdx: (.license // ""
                               | gsub("\\s*/\\s*"; " OR ")
                               | gsub("[()]"; "")) }
                    | select(
                        [ .spdx
                          | split(" AND ")[]
                          | [ split(" OR ")[] | sub("^ +"; "") | sub(" +$"; "") ]
                          | any(. as $t | $ok | index($t)) ]
                        | length == 0 or (all | not))
                    | "  \(.crate): \(if .spdx == "" then "<no license field>"
                                      else .spdx end)" ]
                | if length == 0
                  then "every package in the graph carries a permissive license"
                  else ("packages whose license is not permissive:\n"
                        + join("\n") + "\n" | halt_error(1))
                  end'

      # A package that declares a `links` key builds and links a native
      # library, and the tree allows two names. `liblzma-sys` is the static xz
      # build for the delta paths (`CLAUDE.md`, goal 1). `ring` is an optional
      # dependency of `rustls-webpki` that no feature turns on, so it sits in
      # the resolved graph and nothing builds it: `cargo tree --all-features -i
      # ring` prints nothing and `target/debug/build` holds no `ring` artifact.
      # Remove the `ring` entry when the graph stops resolving it. The step
      # reads `.resolve.nodes`, so a package the lock file names and the
      # resolver leaves out is not asked about.
      #
      # The step applies no test over the `-sys` name suffix. `linux-raw-sys`
      # and `ostrya-sys` carry the suffix and are pure Rust, and a crate that
      # links C need not carry it.
      #
      # The step holds the packages that declare `links` and holds nothing else.
      # A crate that builds and links a C library without a `links` key is
      # invisible to it. `pcre2-sys` is the one such crate in this tree, and the
      # two PCRE2 steps above hold it by name and by the linkage of the shipped
      # binary. The `cargo metadata` call names no `--filter-platform`, so
      # `.resolve.nodes` carries the resolution for every target, and a crate
      # that links C on one target alone is asked about as well.
      - name: Only allowlisted packages link a native library
        run: |
          cargo metadata --format-version 1 --all-features \
            | jq -e -r '
                ["liblzma-sys", "ring"] as $ok
                | [ .resolve.nodes[].id ] as $resolved
                | [ .packages[]
                    | select(.id as $id | $resolved | index($id))
                    | select(.links != null)
                    | select(.name as $n | $ok | index($n) | not)
                    | "  \(.name) \(.version) links=\(.links)" ]
                | if length == 0
                  then "no package outside the allowlist links a native library"
                  else ("packages linking a native library outside the "
                        + "allowlist:\n" + join("\n") + "\n" | halt_error(1))
                  end'

      # `sign-gpg` turns on `verify-gpg`, so every other build in this workflow
      # that carries `verify-gpg` carries `sign-gpg` as well. A consumer that
      # verifies and does not sign takes `verify-gpg` alone, and this compiles
      # that combination, so a cfg gate placed on the signing side of a
      # verification item fails here.
      - name: verify-gpg without sign-gpg compiles
        run: cargo check -p ostrya --no-default-features --features smol,verify-gpg

      # Every other build of the library in this workflow carries a GPG
      # feature. This one carries none, which covers the arm that refuses a
      # pull asking for GPG verification where the build holds no verify
      # engine.
      - name: A build without a GPG feature compiles
        run: cargo check -p ostrya --no-default-features --features smol

      # The local-pull ownership-gate tests need the process to belong to more
      # than one group. The GPG cases need `gpg` to build their fixtures, and
      # the agreement gate needs `gpgv` as its reference. Each skips itself
      # where the arrangement is absent. The runner user belongs to several
      # groups and the image carries both binaries, so this job demands the
      # coverage rather than accepting a silent skip: OSTRYA_REQUIRE_MULTIGROUP
      # and OSTRYA_REQUIRE_GNUPG turn those skips into a failure.
      - name: Test
        run: cargo test --workspace --all-features
        env:
          OSTRYA_REQUIRE_MULTIGROUP: "1"
          OSTRYA_REQUIRE_GNUPG: "1"

      # A record carrying `evidence:` cites a library test by name, so a rename
      # would void its cells with no signal. This resolves every citation
      # against `cargo test -- --list`, which the step above already built.
      - name: Conformance evidence check
        run: cargo run -p ostrya-conformance -- check --verify-evidence
