[package]
name = "ostrya-sign"
description = "Signing and verifying engines for ostrya: dummy, ed25519, spki, and GPG, which signs through gpg and verifies in the process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["smol"]
# The runtime selectors matter only under `gpg-sign`, which runs gpg through
# ostrya-rt. A build without `gpg-sign` holds no runtime.
smol = ["ostrya-rt?/smol"]
tokio = ["ostrya-rt?/tokio"]
# The spki engine with each of its key types: ECDSA P-256, ECDSA P-384,
# Ed25519, and RSA.
spki = ["dep:p256", "dep:p384", "ed25519-dalek/pkcs8", "dep:rsa", "dep:der", "dep:spki", "dep:pkcs8", "dep:pem-rfc7468"]
# The GPG verifier and the keyring functions, over rPGP. The feature holds
# no runtime.
gpg = ["dep:pgp"]
gpg-sign = ["dep:ostrya-rt"]
# The trait `X509Signer`. With `spki`, also the X.509 signer and the X.509
# verifier of the spki engine.
x509 = ["dep:x509-cert"]

# docs.rs adds these four features to the default set, so the pages show the
# items that a feature gates, with a feature badge on each.
[package.metadata.docs.rs]
features = ["spki", "gpg", "gpg-sign", "x509"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ostrya-core = { workspace = true }
ostrya-rt = { workspace = true, optional = true }
thiserror = "2"
ed25519-dalek = { version = "2", default-features = false, features = [
    "std",
    "zeroize",
] }
p256 = { version = "0.13.2", default-features = false, features = [
    "ecdsa",
    "pkcs8",
    "std",
], optional = true }
p384 = { version = "0.13.1", default-features = false, features = [
    "ecdsa",
    "pkcs8",
    "std",
], optional = true }
der = { version = "0.7.10", default-features = false, features = [
    "alloc",
    "oid",
    "zeroize",
], optional = true }
spki = { version = "0.7.3", default-features = false, optional = true }
pkcs8 = { version = "0.10.2", default-features = false, optional = true }
pem-rfc7468 = { version = "0.7.0", default-features = false, features = ["alloc"], optional = true }
# `getrandom` supplies the random source that blinds each RSA private-key
# operation.
rsa = { version = "0.9.10", default-features = false, features = [
    "sha2",
    "u64_digit",
    "getrandom",
], optional = true }
x509-cert = { version = "0.2.5", default-features = false, optional = true }
# rPGP reads OpenPGP keyrings and signatures in the process. `default-features
# = false` is mandatory: the `default` feature reaches `bzip2` and the C
# library behind it, and the `asm` feature turns on assembly paths. A detached
# signature carries no compressed packet, so the verification path needs
# neither.
pgp = { version = "0.20.0", default-features = false, optional = true }

# The key file reader opens with `O_NONBLOCK` on Unix, so a fifo answers the
# open rather than waiting for a writer. `std` does not supply the value of
# the flag.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
futures-lite = "2"
