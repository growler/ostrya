[package]
name = "ostrya-server"
description = "HTTP server of ostrya: the archive view of a repository for pull"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["smol"]
smol = ["ostrya/smol", "ostrya-fetch/smol", "ostrya-rt/smol"]
tokio = ["ostrya/tokio", "ostrya-fetch/tokio", "ostrya-rt/tokio"]

[dependencies]
ostrya = { workspace = true, features = ["receive"] }
# The hyper adapters over the runtime and the server TLS configuration.
ostrya-fetch = { workspace = true }
ostrya-rt = { workspace = true }
thiserror = "2"
futures-io = "0.3"
futures-lite = "2"
# The server connections of hyper. `http1` and `http2` both compile: over
# TLS, ALPN picks the version per connection, and plain HTTP serves HTTP/1.1.
# The `http` and `bytes` types come from hyper's re-exports.
hyper = { version = "1.11.1", default-features = false, features = [
    "server",
    "http1",
    "http2",
] }
# The TLS acceptor. The `rustls` types come from its re-export, and the
# configuration from `ostrya_fetch::server_config`.
futures-rustls = { version = "0.26", default-features = false }
