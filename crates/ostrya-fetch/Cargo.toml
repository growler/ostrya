[package]
name = "ostrya-fetch"
description = "Async HTTP/1.1 and HTTP/2 fetcher for ostrya, with TLS over rustls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["smol"]
smol = ["ostrya-rt/smol"]
tokio = ["ostrya-rt/tokio"]

[dependencies]
ostrya-core = { workspace = true }
ostrya-rt = { workspace = true }
thiserror = "2"
futures-io = "0.3"
futures-lite = "2"
# The HTTP engine behind the fetcher. `http1` and `http2` both compile: ALPN
# picks the version per connection. The `http` and `bytes` types come from
# hyper's re-exports, so neither needs a manifest entry of its own.
hyper = { version = "1.11.1", default-features = false, features = [
    "client",
    "http1",
    "http2",
] }
# URL parsing for the fetcher. `Url::join` resolves the `Location` of a
# redirect against the URL of the response, which is the one call the
# library makes into this crate; a mirror URL, a request URL, and a proxy
# URL are read by the `hyper::Uri` parse. The default feature set is taken
# because `idna` is a mandatory dependency: `default-features = false`
# drops neither it nor the Unicode tables it carries.
url = "2.5.8"
# TLS for the fetcher. `rustls-graviola` supplies the crypto provider: Rust
# plus formally-verified assembly, so the provider adds no C to the build and
# carries no `cc` build dependency.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }
rustls-graviola = "0.4"
futures-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
# Reads an encrypted PKCS#8 client key for the fetcher and decrypts it.
# `default-features = false` with `encryption`, `pem` and `std` is the
# minimum for that job: `pem` reads the PEM armor, `encryption` supplies
# the PBES2 decryption path, and `std` supplies the standard error trait.
# The `3des` and `des-insecure` features stay off, so no DES or 3DES
# cipher enters the build.
pkcs8 = { version = "0.10.2", default-features = false, features = [
    "encryption",
    "pem",
    "std",
] }
