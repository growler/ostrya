[package]
name = "ostrya"
description = "Pure-Rust async reimplementation of the ostree repository library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["smol"]
smol = ["ostrya-rt/smol"]
tokio = ["ostrya-rt/tokio"]
sign-spki = ["dep:p256"]
verify-gpg = ["dep:pgp"]
sign-gpg = ["verify-gpg"]

[dependencies]
ostrya-core = { workspace = true }
ostrya-composefs = { workspace = true }
ostrya-rt = { workspace = true }
ostrya-sys = { workspace = true }
thiserror = "2"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
async-compression = { version = "0.4", default-features = false, features = [
    "deflate",
    "xz",
    "futures-io",
] }
# liblzma backs async-compression's xz codec (delta parts, both directions).
# This direct dependency exists only to force static linking via feature
# unification: bundled xz built from source, no runtime liblzma, no C runtime
# beyond the libc std already links.
liblzma = { version = "0.4", features = ["static"] }
# bsdiff patch generation for static-delta `B` ops. Zero dependencies, no
# unsafe, and its output is the interleaved control/diff/extra layout
# `bspatch.rs` reads.
bsdiff = "0.2.1"
# The raw-DEFLATE encoder behind archive-mode content objects. Pinning the
# compressor directly keeps the stored `.filez` bytes fixed for a given
# `[archive] zlib-level`, independent of the feature set the build enables.
# The requirement is exact, since the encoder output is the bytes stored in
# every archive-mode content object. The gate on that output is the golden
# vectors in `src/write.rs` and
# `archive_objects_are_byte_identical_to_the_fixture` in `tests/write.rs`. A
# move to another version is a deliberate step, and it re-measures both
# records.
miniz_oxide = "=0.8.9"
pin-project-lite = "0.2"
futures-io = "0.3"
futures-lite = "2"
# The HTTP engine behind the fetcher. `http1` and `http2` both compile: ALPN
# picks the version per connection. The `http` and `bytes` types come from
# hyper's re-exports, so neither needs a manifest entry of its own.
hyper = { version = "1.11", default-features = false, features = [
    "client",
    "http1",
    "http2",
] }
# TLS for the fetcher. `rustls-graviola` supplies the crypto provider: Rust
# plus formally-verified assembly, so the provider adds no C to the build and
# carries no `cc` build dependency.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }
rustls-graviola = "0.4"
futures-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
smol-tar = { version = "=0.1.7", default-features = false, features = ["smol"] }
ed25519-dalek = { version = "2", default-features = false, features = [
    "std",
    "zeroize",
] }
p256 = { version = "0.13.2", default-features = false, features = [
    "ecdsa",
    "pem",
    "pkcs8",
    "std",
], optional = true }
# rPGP reads OpenPGP keyrings and signatures in the process. `default-features
# = false` is mandatory: the `default` feature reaches `bzip2` and the C
# library behind it, and the `asm` feature turns on assembly paths. A detached
# signature carries no compressed packet, so the verification path needs
# neither.
pgp = { version = "0.20.0", default-features = false, optional = true }

[dev-dependencies]
ostrya-rt = { workspace = true }
futures-lite = "2"
smol-tar = { version = "=0.1.7", default-features = false, features = ["smol"] }
# The fetcher tests serve requests from an in-process HTTP/1.1 and HTTP/2
# server, so the test build adds hyper's server half.
hyper = { version = "1.11", default-features = false, features = ["server"] }
