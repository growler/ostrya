[package]
name = "ostrya-cli"
description = "Command-line front-end for the ostrya library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ostrya"
path = "src/main.rs"

[features]
default = ["smol", "spki", "gpg"]
smol = ["ostrya/smol", "ostrya-rt/smol"]
tokio = ["ostrya/tokio", "ostrya-rt/tokio"]
spki = ["ostrya/sign-spki"]
gpg = ["ostrya/sign-gpg"]

[dependencies]
ostrya = { path = "../ostrya", default-features = false }
ostrya-rt = { workspace = true }
clap = { version = "4", features = ["derive"] }
# `commit --tar-pathname-filter` compiles an expression. The tool compiles a
# PCRE through GLib; the port compiles the `regex` dialect, which is a
# functional equivalent and not a character-for-character one
# (`docs/conformance/cli-surface.md`, "P2").
regex = "1"

# `tests/conformance.rs` runs the conformance matrix against the binary this
# crate builds (`docs/conformance/harness.md`, "Cargo and CI wiring"). The
# harness links no library of the port; it drives the built binary.
[dev-dependencies]
ostrya-conformance = { path = "../ostrya-conformance" }
