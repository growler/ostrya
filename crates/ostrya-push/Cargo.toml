[package]
name = "ostrya-push"
description = "The push protocol of ostrya: the wire codec, the client session, and the ssh transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["smol"]
smol = ["ostrya-rt/smol"]
tokio = ["ostrya-rt/tokio"]

[dependencies]
ostrya-gvariant = { workspace = true }
ostrya-core = { workspace = true }
# The ssh transport runs the ssh client as a child process, and bounds the
# waits of a session over it with a timer.
ostrya-rt = { workspace = true }
thiserror = "2"
futures-io = "0.3"
futures-lite = "2"
